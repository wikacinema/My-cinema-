<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIKA TV PRO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; }
        header { background: #111; padding: 15px; text-align: center; border-bottom: 2px solid #e50914; position: sticky; top: 0; z-index: 100; }
       .logo { color: #e50914; font-size: 24px; font-weight: bold; margin-bottom: 15px; }
       .filters { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
       .filters::-webkit-scrollbar { display: none; }
       .filter-btn { background: #222; color: #fff; border: 1px solid #333; padding: 8px 16px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-size: 14px; }
       .filter-btn.active { background: #e50914; border-color: #e50914; }
       .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 15px; }
       .card { background: #1a1a1a; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
       .card:hover { transform: scale(1.05); }
       .card img { width: 100%; height: 100px; object-fit: cover; background: #333; }
       .card-title { padding: 10px; font-size: 13px; text-align: center; height: 45px; overflow: hidden; }
       .player-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; }
       .player-box { position: relative; width: 95%; max-width: 900px; margin: 50px auto; background: #000; border-radius: 8px; overflow: hidden; }
       .close-btn { position: absolute; top: 10px; left: 10px; background: #e50914; color: #fff; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 20px; }
        video { width: 100%; height: auto; max-height: 80vh; }
       .loading { text-align: center; padding: 40px; width: 100%; grid-column: 1/-1; }
       .search-box { padding: 10px 15px; }
       .search-box input { width: 100%; padding: 12px; border-radius: 25px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 15px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">WIKA TV PRO</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن قناة..." onkeyup="searchChannels()">
        </div>
        <div class="filters" id="filters">
            <button class="filter-btn active" onclick="filterTV('all', this)">الكل</button>
            <button class="filter-btn" onclick="filterTV('World Cup', this)">🏆 كأس العالم</button>
            <button class="filter-btn" onclick="filterTV('Sport', this)">⚽ رياضة</button>
            <button class="filter-btn" onclick="filterTV('bein', this)">beIN</button>
            <button class="filter-btn" onclick="filterTV('News', this)">أخبار</button>
            <button class="filter-btn" onclick="filterTV('Kids', this)">أطفال</button>
            <button class="filter-btn" onclick="filterTV('Arabic', this)">عربية</button>
            <button class="filter-btn" onclick="filterTV('Iraq', this)">🇮🇶 العراق</button>
        </div>
    </header>

    <div class="grid" id="channels-grid">
        <div class="loading">جاري تحميل القنوات...</div>
    </div>

    <div class="player-modal" id="playerModal">
        <div class="player-box">
            <button class="close-btn" onclick="closePlayer()">×</button>
            <video id="videoPlayer" controls autoplay></video>
        </div>
    </div>

    <script>
        let allChannels = [];
        let currentFilter = 'all';
        
        async function loadChannels() {
            const grid = document.getElementById('channels-grid');
            grid.innerHTML = '<div class="loading">جاري تحميل القنوات من 3 مصادر...</div>';
            
            const urls = [
                'https://iptv-org.github.io/iptv/index.m3u',
                'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8',
                'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/sport.m3u'
            ];
            
            allChannels = [];
            for(let url of urls) {
                try {
                    const res = await fetch(url);
                    const text = await res.text();
                    const lines = text.split('\n');
                    for (let i = 0; i < lines.length; i++) {
                        if (lines[i].startsWith('#EXTINF')) {
                            const streamUrl = lines[i+1]?.trim();
                            const name = lines[i].split(',')[1]?.trim() || "قناة";
                            const logo = lines[i].match(/tvg-logo="([^"]+)"/)?.[1] || "https://via.placeholder.com/150x100/222/fff?text=TV";
                            const group = lines[i].match(/group-title="([^"]+)"/)?.[1] || "";
                            if(streamUrl?.startsWith('http')) {
                                allChannels.push({name, url: streamUrl, logo, group});
                            }
                        }
                    }
                } catch(e) { console.log('Error loading:', url); }
            }
            renderChannels();
        }
        
        function renderChannels() {
            const grid = document.getElementById('channels-grid');
            let filtered = allChannels;
            if(currentFilter !== 'all') {
                filtered = allChannels.filter(ch => 
                    ch.name.toLowerCase().includes(currentFilter.toLowerCase()) || 
                    ch.group.toLowerCase().includes(currentFilter.toLowerCase())
                );
            }
            if(filtered.length === 0) {
                grid.innerHTML = '<div class="loading">لا توجد قنوات</div>';
                return;
            }
            grid.innerHTML = filtered.map(ch => `
                <div class="card" onclick="playChannel('${ch.url.replace(/'/g, "\'")}')">
                    <img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/150x100/222/fff?text=TV'">
                    <div class="card-title">${ch.name}</div>
                </div>
            `).join('');
        }
        
        function filterTV(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderChannels();
        }
        
        function searchChannels() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('channels-grid');
            const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(q));
            grid.innerHTML = filtered.map(ch => `
                <div class="card" onclick="playChannel('${ch.url.replace(/'/g, "\'")}')">
                    <img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/150x100/222/fff?text=TV'">
                    <div class="card-title">${ch.name}</div>
                </div>
            `).join('');
        }
        
        function playChannel(url) {
            document.getElementById('playerModal').style.display = 'block';
            const video = document.getElementById('videoPlayer');
            video.src = url;
            video.play().catch(e => alert('القناة لا تعمل حاليا'));
        }
        
        function closePlayer() {
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('videoPlayer').pause();
            document.getElementById('videoPlayer').src = '';
        }
        
        window.onload = loadChannels;
    </script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;var a=target.closest?target.closest("a[href]"):null;if(!a||!a.href||!/^https?:\/\//.test(a.href))return;if(a.href.replace(/#.*$/,"")===loc)return;var productId=extractProductId(target)||extractProductId(a);if(!productId)return;e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*")},true)})();</script></body>
</html>
